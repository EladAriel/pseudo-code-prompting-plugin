name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          if ! jq empty plugin.json 2>/dev/null; then
            echo "❌ plugin.json is invalid"
            exit 1
          fi
          echo "✅ plugin.json is valid"

      - name: Validate marketplace.json
        run: |
          if ! jq empty .claude-plugin/marketplace.json 2>/dev/null; then
            echo "❌ marketplace.json is invalid"
            exit 1
          fi
          echo "✅ marketplace.json is valid"

      - name: Verify version consistency
        run: |
          PLUGIN_VERSION=$(jq -r '.version' plugin.json)
          MARKETPLACE_VERSION=$(jq -r '.version' .claude-plugin/marketplace.json)

          if [ "$PLUGIN_VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "❌ Version mismatch: plugin.json ($PLUGIN_VERSION) vs marketplace.json ($MARKETPLACE_VERSION)"
            exit 1
          fi
          echo "✅ Versions are consistent: $PLUGIN_VERSION"

  validate-markdown:
    name: Validate Markdown Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          echo "Linting markdown files..."
          markdownlint '**/*.md' --ignore node_modules --ignore .github || true
          echo "✅ Markdown lint complete"

      - name: Check for broken internal links
        run: |
          echo "Checking internal markdown links..."
          for file in docs/*.md commands/*.md agents/*.md; do
            if [ -f "$file" ]; then
              echo "Checking links in $file"
              grep -oP '\[.*?\]\(\K[^)]+(?=\))' "$file" | while read -r link; do
                # Skip external URLs
                if [[ "$link" =~ ^https?:// ]]; then
                  continue
                fi
                # Skip anchor links (internal page links starting with #)
                if [[ "$link" =~ ^# ]]; then
                  continue
                fi
                # Skip directory links (ending with /)
                if [[ "$link" =~ /$ ]]; then
                  continue
                fi
                # Check if file exists (relative to file location)
                target="${link%%#*}"
                dir=$(dirname "$file")
                if [ ! -f "$dir/$target" ] && [ ! -f "$target" ]; then
                  echo "❌ Broken link in $file: $link"
                  exit 1
                fi
              done || exit 1
            fi
          done
          echo "✅ Internal links OK"

  validate-tests:
    name: Validate Test Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check test specifications
        run: |
          echo "Validating test files..."

          test_count=$(find tests -name "*.md" -type f 2>/dev/null | wc -l)
          if [ "$test_count" -gt 0 ]; then
            echo "✅ Found $test_count test specification files"
            for file in tests/*.md; do
              if [ -f "$file" ]; then
                echo "  - $(basename $file)"
              fi
            done
          else
            echo "⚠️  No test files found"
          fi

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify plugin structure
        run: |
          echo "Verifying plugin file structure..."

          required_files=(
            "plugin.json"
            ".claude-plugin/marketplace.json"
            "README.md"
            "CHANGELOG.md"
            "LICENSE"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

          # Verify required directories
          required_dirs=(
            "commands"
            "agents"
            "skills"
            "docs"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              exit 1
            fi
            echo "✅ Found: $dir"
          done

          echo "✅ Plugin structure verified"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate-json, validate-markdown, validate-tests, integration-test]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.validate-json.result }}" != "success" ]]; then
            echo "❌ JSON validation failed"
            exit 1
          fi
          if [[ "${{ needs.validate-markdown.result }}" != "success" ]]; then
            echo "❌ Markdown validation failed"
            exit 1
          fi
          if [[ "${{ needs.validate-tests.result }}" != "success" ]]; then
            echo "❌ Test validation failed"
            exit 1
          fi
          if [[ "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "❌ Integration test failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"
